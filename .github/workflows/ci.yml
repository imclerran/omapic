name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same ref so a quick succession of pushes doesn't
# queue up redundant builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    # Build on Arch with the same Qt6 the app targets, rather than fighting an
    # older Qt on the default runner image.
    container: archlinux:latest

    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git cmake ninja \
            qt6-base qt6-declarative qt6-multimedia exiv2

      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -G Ninja -DOMAPIC_BUILD_TESTS=ON -Wno-dev

      - name: Build
        run: cmake --build build

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure
